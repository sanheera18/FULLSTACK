<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Post a Job - JobPortal')}"></head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/fragments :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header py-3">
                    <h4 class="mb-0">Post a New Job</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/employer/jobs}" th:object="${job}" method="post">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="title" class="form-label">Job Title</label>
                                <input type="text" class="form-control" id="title" th:field="*{title}" required>
                                <span class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                            </div>
                            <div class="col-md-6">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-control" id="category" th:field="*{category}" required>
                                    <option value="">Select Category...</option>
                                    <option value="IT & Software">IT & Software</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Finance">Finance</option>
                                    <option value="HR">HR</option>
                                    <option value="Engineering">Engineering</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" th:field="*{location}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="salary" class="form-label">Salary Range</label>
                                <input type="text" class="form-control" id="salary" th:field="*{salary}" placeholder="e.g. $50k - $70k" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="skillsRequired" class="form-label">Skills Required (comma separated)</label>
                            <input type="text" class="form-control" id="skillsRequired" th:field="*{skillsRequired}" required>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">Job Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="6" required></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/employer/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-premium-primary px-4">Post Job</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragments :: footer}"></div>

</body>
</html>
