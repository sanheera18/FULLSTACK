<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Home - JobPortal')}"></head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/fragments :: navbar}" class="mb-0"></div>

<!-- Hero Section -->
<div class="container-fluid px-0 flex-grow-1 d-flex flex-column position-relative">
    <div class="row g-0 flex-grow-1" style="min-height: calc(100vh - 160px);">
        <div class="col-lg-6 d-flex flex-column justify-content-center p-5" style="z-index: 2;">
            <div class="ps-lg-5 pe-lg-4">
                <h1 class="display-4 fw-bold mb-4 text-white" style="line-height: 1.2;">
                    Find Your <br><span class="text-gradient">Dream Job</span><br> Today.
                </h1>
                <p class="lead mb-5 text-muted-custom" style="max-width: 500px; font-size: 1.1rem;">
                    Connect with top employers and discover opportunities that match your skills. Join our premium portal for a refreshing job search experience.
                </p>
                <div class="d-flex flex-wrap gap-3">
                    <a th:href="@{/jobs}" class="btn btn-premium-primary btn-lg px-5 rounded-pill shadow-lg" style="transition: all 0.3s ease;">
                        Browse Jobs <i class="bi bi-arrow-right ms-2"></i>
                    </a>
                    <a th:href="@{/register}" class="btn btn-outline-premium btn-lg px-5 rounded-pill shadow-lg" style="backdrop-filter: blur(10px);">
                        Create Your Account
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Right side image taking full height/width of its column -->
        <div class="col-lg-6 position-absolute top-0 end-0 h-100 d-none d-lg-block" style="z-index: 1;">
            <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80" 
                 alt="People working in office" 
                 class="w-100 h-100" 
                 style="object-fit: cover; filter: brightness(0.6);">
                 
            <!-- Gradient Overlay to blend the image into the dark background -->
            <div class="position-absolute top-0 start-0 w-100 h-100" 
                 style="background: linear-gradient(to right, #0f172a 0%, rgba(15, 23, 42, 0.5) 40%, transparent 100%);">
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragments :: footer}"></div>

</body>
</html>
